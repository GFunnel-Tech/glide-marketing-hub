project_id = "kkuvdoejqruszisyojap"

# Admin endpoints: require a valid Supabase JWT at the gateway. The function
# code then additionally enforces the super_admin role.
[functions.admin-users]
verify_jwt = true

[functions.admin-impersonate]
verify_jwt = true

# Team member invite/create — requires a valid Supabase JWT at the gateway; the
# function then enforces workspace owner/admin (or super_admin) before creating
# a real login user.
[functions.workspace-invite-user]
verify_jwt = true

# Portal chat thread provisioner — requires a valid Supabase JWT at the gateway;
# the function then enforces that the caller is a portal user for the client.
[functions.portal-chat]
verify_jwt = true

# Onboarding Drive sync — JWT verified at the gateway, then authorizes the
# caller as either the client's portal user or a workspace writer.
[functions.onboarding-drive-sync]
verify_jwt = true

# Onboarding asset staging — flips processing_status flags and returns signed
# URLs for the downstream ElevenLabs / Higgsfield pipeline. Workspace writers only.
[functions.onboarding-process-stage]
verify_jwt = true

# Public tracking collector + snippet
[functions.track]
verify_jwt = false

# Scheduled alert scanner — invoked by pg_cron
[functions.client-alerts-scan]
verify_jwt = false

# Per-client Stripe webhook receiver — Stripe sends no Supabase JWT; the
# function verifies the per-client Stripe signing secret instead.
[functions.stripe-client-webhook]
verify_jwt = false

# Stripe Connect OAuth return URL — hit by Stripe's browser redirect, which
# carries no Supabase session. Secured by the single-use state nonce.
[functions.stripe-client-oauth-callback]
verify_jwt = false

# Public Affiliate/Partner API — third parties (Partnero, Rewardful, Zapier,
# custom scripts) send no Supabase JWT; the function authenticates via
# workspace-scoped API keys (hashed in affiliate_api_keys) and, for inbound
# provider webhooks, the per-integration webhook token + optional HMAC secret.
[functions.affiliate-api]
verify_jwt = false

# Affiliate integration manager (API key minting, provider test/sync) —
# requires a valid Supabase JWT; the function then enforces workspace
# owner/admin before touching credentials.
[functions.affiliate-sync]
verify_jwt = true
